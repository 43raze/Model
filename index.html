<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <h1 class="header__title">Каталог</h1>
    </header>

    <main class="container">
      <form class="add-form add-form--category">
        <input
          type="text"
          name="title"
          class="add-form__input"
          placeholder="Название новой категории"
        />
        <button type="submit" class="add-form__button add-form__button--primary">
          Добавить категорию
        </button>
        <p class="form-error"></p>
      </form>

      <div class="categories"></div>
      <div class="empty-state" hidden>Категорий пока нет</div>
    </main>

    <script src="./js/model.js"></script>
    <script src="./js/view/generators.js"></script>
    <script src="./js/view/renders.js"></script>
    <script src="./js/view/listeners.js"></script>
    <script src="./js/controller.js"></script>
  </body>
</html>
