<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      function handleContentLoaded(text, timestamp) {
        const categories = getCategories(text, timestamp)
        renderCategories(categories)
      }

      function onDOMContentLoaded(e) {
        let text = document.querySelector('h1').textContent
        handleContentLoaded(text, e.timestamp)
      }

      document.addEventListener('DOMContentLoaded', onDOMContentLoaded)

      // document.addEventListener('DOMContentLoaded', () => {
      //   console.log('hello page')
      //   let x = document.querySelector('h1')
      //   console.log(x)
      //   onDOMContentLoaded()
      // })
    </script>
  </head>

  <body>
    <header class="header">
      <h1 class="header__title">Каталог</h1>
    </header>

    <main class="container">
      <form class="add-form add-form--category">
        <input
          type="text"
          name="title"
          class="add-form__input"
          placeholder="Название новой категории"
        />
        <button
          type="submit"
          class="add-form__button add-form__button--primary"
        >
          Добавить категорию
        </button>
        <p class="form-error"></p>
      </form>

      <div class="categories"></div>
      <div class="empty-state" hidden>Категорий пока нет</div>
    </main>

    <script type="module" src="./js/controller.js"></script>
  </body>
</html>
